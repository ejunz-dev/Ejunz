# Generic Web surface: API routes, browser clients, local storage and web tools.

- id: web-search-deepseek
  disabled: true

- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- insert:
    - id: storage
      name: '@ejunz/ea/storage'

    - id: storage-json
      name: '@ejunz/ea/storage-json'
      config:
        root: !!js eaHomePath('storage')

    - id: storage-domain
      name: '@ejunz/ea/storage-domain'
      config:
        backend: json

    - id: session-projection-cache
      name: '@ejunz/ea/session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: session-stats
      name: '@ejunz/ea/session-stats'

    - id: plugin-inventory
      name: '@ejunz/profile-web/host/plugin-inventory'

    - id: api-gateway
      name: '@ejunz/profile-web/host/apiproxy'
      config:
        useDefaultModel: false

    - id: webserver
      name: '@ejunz/profile-web/host/webserver'
      config:
        host: '127.0.0.1'
        port: 0

    - id: web-runtime
      name: '@ejunz/profile-web/app'
      config:
        trustedHosts: []

    - id: connection
      name: '@ejunz/profile-web/client/connection'
      inject: [webRuntime]
      config:
        trustedHosts: !!js ctx.webRuntime.trustedHosts

    - id: api-remotes
      name: '@ejunz/profile-web/api/remotes'

    - id: agent-presets
      name: '@ejunz/ea/agent-presets'
      config:
        default: standard
        includeUserRoot: false

# Keep model-facing registries scoped to the selected Agent preset.
- id: tool-jobs
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

- id: tool-workflow
  disabled: true
